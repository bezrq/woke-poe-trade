name: Docs

# The site (landing page + help pages) deploys from master only: GitHub Pages
# takes deploys from the default branch. It also reads the module list and the
# app version, so those changes redeploy it too.
on:
  push:
    branches:
      - master
    paths:
      - 'docs/**'
      - 'renderer/src/web/woke/modules.ts'
      - 'main/package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - run: npm install
        working-directory: ./docs
      - run: npx vitepress build
        working-directory: ./docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/.vitepress/dist
      - uses: actions/deploy-pages@v4
