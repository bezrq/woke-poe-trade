[package]
name = "woke-tauri-spike"
version = "0.0.1"
edition = "2021"
description = "Throwaway test: can Tauri (Rust + WebView2) host the toolkit overlay over PoE?"
publish = false

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "cookies", "gzip", "brotli", "deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3.7"
futures-util = "0.3"
parking_lot = "0.12"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi",
  "Win32_Graphics_Gdi",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_UI_Accessibility",
] }

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
